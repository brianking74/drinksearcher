<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — drinksearcher.net</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=105">
  <link rel="stylesheet" href="assets/css/premium.css?v=16">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
</head>
<body data-page="reset-password">
  <main id="app" class="page"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=119"></script>
  <script>
    (async () => {
      const app = document.getElementById('app');
      app.innerHTML = `
        <section class="hero" style="min-height:52vh;"><div class="hero-media" style="background-image:url('assets/brand/hero.jpg')"></div><div class="container hero-grid"><div class="hero-copy"><span class="kicker">Account</span><h1>Choose a new password.</h1><p class="lead">Enter a new password for your account.</p></div><div class="search-shell"><span class="eyebrow">Reset password</span><form id="reset-form" class="form-grid" style="margin-top:14px;"><input class="input full" name="password" type="password" placeholder="New password" required minlength="6" /><input class="input full" name="confirm" type="password" placeholder="Confirm new password" required minlength="6" /><button class="btn btn-primary full" type="submit">Update password</button></form><div id="reset-notice"></div><p class="muted" style="margin-top:16px;"><a class="text-jade" href="signin.html">Back to sign in</a></p></div></div></section>`;
      const form = document.getElementById('reset-form');
      if (!form) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = form.password.value.trim();
        const confirm = form.confirm.value.trim();
        const notice = document.getElementById('reset-notice');
        if (!password || password.length < 6) {
          notice.innerHTML = '<div class="notice" style="background:rgba(255,46,126,.08);border-color:rgba(255,46,126,.18);color:#ffd0e2;">Password must be at least 6 characters.</div>';
          return;
        }
        if (password !== confirm) {
          notice.innerHTML = '<div class="notice" style="background:rgba(255,46,126,.08);border-color:rgba(255,46,126,.18);color:#ffd0e2;">Passwords do not match.</div>';
          return;
        }
        notice.innerHTML = '<div class="notice">Updating password...</div>';
        try {
          const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
          const accessToken = hashParams.get('access_token');
          const refreshToken = hashParams.get('refresh_token');
          if (accessToken && refreshToken) {
            const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
            if (error) throw error;
            const { error: updateError } = await sb.auth.updateUser({ password });
            if (updateError) throw updateError;
            await sb.auth.signOut();
            notice.innerHTML = '<div class="notice">Password updated. Redirecting to sign in…</div>';
            setTimeout(() => { window.location.href = 'signin.html'; }, 900);
            return;
          }
          notice.innerHTML = '<div class="notice" style="background:rgba(255,46,126,.08);border-color:rgba(255,46,126,.18);color:#ffd0e2;">Missing reset token. Use the link from your email.</div>';
        } catch (err) {
          notice.innerHTML = `<div class="notice" style="background:rgba(255,46,126,.08);border-color:rgba(255,46,126,.18);color:#ffd0e2;">${err.message || 'Reset failed'}</div>`;
        }
      });
    })();
  </script>
</body>
</html>
